[alembic]
script_location = alembic
prepend_sys_path = src
# The URL is resolved at runtime from Settings (DATABASE_URL); this value is a
# placeholder that env.py always overrides.
sqlalchemy.url = postgresql+asyncpg://metropulse:metropulse@localhost:5432/metropulse

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
