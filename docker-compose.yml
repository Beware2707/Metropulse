services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metropulse
      POSTGRES_PASSWORD: metropulse
      POSTGRES_DB: metropulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metropulse -d metropulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://metropulse:metropulse@postgres:5432/metropulse
      REDIS_URL: redis://redis:6379/0
      DMRC_API_KEY: ${DMRC_API_KEY:?set DMRC_API_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "metropulse.cli", "run-worker"]
    environment: *app-env
    healthcheck:
      disable: true  # the image healthcheck probes HTTP; the worker has none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
