name: metropulse_app
description: MetroPulse - live Delhi Metro companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  maplibre_gl: ^0.26.0
  web_socket_channel: ^3.0.1
  intl: ^0.20.2
  uuid: ^4.4.2
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.2.2
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

