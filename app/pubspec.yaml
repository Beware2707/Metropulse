name: metropulse_app
description: MetroPulse - live Delhi Metro companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  maplibre_gl: ^0.26.0
  web_socket_channel: ^3.0.1
  intl: ^0.20.2
  uuid: ^4.4.2
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.2.2
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  connectivity_plus: ^6.0.5
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  # Bundled Plus Jakarta Sans weights, once you add them — see
  # assets/google_fonts/README.md. google_fonts prioritizes a matching font
  # file found here over an HTTP fetch at runtime, so this is what removes
  # the first-paint font-swap flash on a cold start.
  assets:
    - assets/icon/
    - assets/google_fonts/
    - assets/network_schematic.json

